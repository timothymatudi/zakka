name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-typecheck:
    name: Web typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint

  search-test:
    name: Search service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/search/package-lock.json
      - run: npm ci
      - run: npx vitest run

  concierge-test:
    name: Concierge service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/concierge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/concierge/package-lock.json
      - run: npm ci
      - run: npx vitest run

  catalog-test:
    name: Catalog service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog/requirements*.txt
      - run: pip install -r services/catalog/requirements.txt
        working-directory: services/catalog
        continue-on-error: true
      - run: python -m pytest services/catalog/tests -q
        env:
          PYTHONPATH: services/catalog/src
