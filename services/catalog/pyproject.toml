[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zakka-catalog"
version = "0.1.0"
description = "Zakka catalog service: supplier/affiliate connectors, sync, pricing, order forwarding"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zakka-catalog = "zakka_catalog.cli:main"

[tool.setuptools.packages.find]
include = ["zakka_catalog*"]

[tool.setuptools.package-data]
zakka_catalog = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
